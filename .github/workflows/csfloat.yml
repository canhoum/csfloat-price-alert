name: CSFloat Price Alerts

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: csfloat-price-alert
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore previous state
        id: restore-state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: csfloat-state-${{ github.run_id }}
          restore-keys: |
            csfloat-state-

    - name: Show state status
      run: |
        echo "Cache hit: ${{ steps.restore-state.outputs.cache-hit }}"
        if [ -f state.json ]; then
          echo "state.json encontrado:"
          cat state.json
        else
          echo "state.json NÃO encontrado."
        fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check CSFloat
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python csfloat_alert.py

      - name: Save current state
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: csfloat-state-${{ github.run_id }}